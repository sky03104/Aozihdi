    function parseXlsx(wb, addrIsPaiHsiu) {

        const ref = XLSX.utils.decode_range(ws["!ref"] || "A1:BL40");

        const parsed = [];
        for (let r = 3; r <= ref.e.r; r++) {
            const nc = XLSX.utils.encode_cell({ r, c: 1 });
            const rc = XLSX.utils.encode_cell({ r, c: 0 });
            if (!ws[nc])
                continue;
            const name = String(ws[nc].v || '').trim();
            if (!name || name.length < 2 || /^\d/.test(name))
                continue;
            const roleStr = ws[rc] ? String(ws[rc].v || '').trim() : '';
            const role = ROLE_XL[roleStr] || 'staff';
            const shifts = {};
            for (let d = 1; d <= DAYS; d++) {
                const addr = XLSX.utils.encode_cell({ r, c: d + 1 });
                const cell = ws[addr];
                if (!cell) {
                    shifts[d] = '-';
                    continue;
                }
                let v = String(cell.v || '').trim();
                if (!v || v === '-' || v === '—') {
                    shifts[d] = '-';
                    continue;
                }
                // 若是「休」且該座標被標記為排休，轉成排休
                if (v === '休' && paiSet.get(addr)) {

                                const newShift = (selectedUser.shift === '早班') ? '早班' : '晚班';
                                // Save to userDb (real account store)
                                setUserDb(prev => ({
                                    ...prev,
                                    [tgtId]: {
                                        ...prev[tgtId],
                                        name: selectedUser.name,
                                        role: selectedUser.role,
                                        dept: selectedUser.dept,
                                        status: selectedUser.status,
                                        shift: newShift,
                                    }
                                }));
                                // 同步寫入雲端「帳號管理」分頁（含班別）
                                (async () => {
                                    try {
                                        const body = new FormData();
                                        body.append('action', 'updateUser');
                                        body.append('data', JSON.stringify({
                                            empId: tgtId,
                                            name: selectedUser.name,
                                            role: selectedUser.role,
                                            dept: selectedUser.dept,
                                            status: selectedUser.status,
                                            shift: newShift,
                                        }));
                                        const res = await fetch(ACCOUNT_GAS_URL, { method: 'POST', body });
                                        const dd = await res.json();
                                        if (dd.status !== 'ok') showToast('⚠️ 雲端同步失敗：' + (dd.msg || '未知錯誤'), 'err');
                                    } catch (err) {
                                        showToast('⚠️ 雲端同步連線失敗：' + err.message, 'err');
                                    }
                                })();
                                setSelectedUser(null);
                                showToast("✅ 員工資料已更新！");
                            } }, "\uD83D\uDCBE \u5132\u5B58\u8B8A\u66F4"));
                })()))),
        currentUser && React.createElement(MascotWidget, { key: "mascot-widget", empId: currentUser.empId })
    ));
}
const rootEl = document.getElementById('root');
const reactRoot = ReactDOM.createRoot(rootEl);
reactRoot.render(React.createElement(App, null));
setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash) {
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 700);
    }
}, 800);
</script>
</body>
</html>
