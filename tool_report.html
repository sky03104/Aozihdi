<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天鷹保全 · 事故報告填寫</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <style>
        :root {
            --bg: #0A0C10;
            --surface: #111827;
            --primary: #D4A800;
            --primary-glow: rgba(212, 168, 0, 0.3);
            --text: #F5F5F5;
            --text-muted: #8A95A8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #4ADE80;
            --error: #F87171;
            --glass: rgba(255, 255, 255, 0.03);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; }
        #splash { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        #splash.hide { opacity: 0; visibility: hidden; }
        .splash-ring { width: 50px; height: 50px; border: 3px solid transparent; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 60px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .back-btn { background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .logo-area { text-align: center; margin-bottom: 24px; }
        .title-main { color: var(--primary); font-size: 20px; font-weight: 700; margin-top: 12px; letter-spacing: 2px; }
        .card { background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        .label i { color: var(--primary); }
        .input, .select, .textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--text); font-size: 16px; outline: none; }
        .textarea { min-height: 120px; resize: none; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #D4A800, #F0C040); color: #000; border: none; padding: 18px; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 20px rgba(212,168,0,0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .photo-grid { display: flex; gap: 12px; margin-top: 4px; }
        .photo-box { flex: 1; aspect-ratio: 1; background: rgba(255,255,255,0.04); border: 2px dashed var(--border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; position: relative; overflow: hidden; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 14px 28px; border-radius: 50px; font-weight: 600; z-index: 10000; display: flex; align-items: center; gap: 10px; transition: all 0.3s; }
        .spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div id="splash"><div class="splash-ring"></div></div>
    <div id="root"></div>
    <script>
        const { useState, useEffect } = React;
        const params = new URLSearchParams(window.location.search);
        const empId = params.get('empId') || '未登入';

        function App() {
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                time: new Date().toTimeString().slice(0,5),
                location: '',
                category: '一般事故',
                description: '',
                action: '',
                personnel: ''
            });
            const [photos, setPhotos] = useState([null, null, null]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                setTimeout(() => {
                    const s = document.getElementById('splash');
                    if(s) { s.classList.add('hide'); setTimeout(() => s.remove(), 500); }
                }, 600);
            }, []);

            const handleFileChange = (index, e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    const newPhotos = [...photos];
                    newPhotos[index] = reader.result;
                    setPhotos(newPhotos);
                };
                reader.readAsDataURL(file);
            };

            const handleSubmit = async () => {
                if (!formData.location || !formData.description) {
                    showToast("⚠️ 請填寫地點與事故描述", "err");
                    return;
                }
                setLoading(true);
                try {
                    const GAS_URL = "https://script.google.com/macros/s/AKfycbwHXlwTMmJyA79Cuzdh2IPRnBLUWm2YPEqXn5XJj4GVEUlCnNIv8hgRTJ7Xr198hZxG/exec"; 
                    const body = new FormData();
                    body.append('data', JSON.stringify({
                        ...formData,
                        empId: empId,
                        photos: photos.filter(p => p !== null)
                    }));

                    const res = await fetch(GAS_URL, { method: 'POST', body: body });
                    const result = await res.json();

                    if (result.status === 'ok') {
                        showToast("✅ 報告與照片已成功存入雲端！", "success");
                        setTimeout(() => window.location.href = `../index.html?empId=${empId}`, 2000);
                    } else {
                        showToast("❌ 提交失敗：" + result.msg, "err");
                    }
                } catch (error) {
                    showToast("❌ 網路連線錯誤，請稍後再試", "err");
                } finally {
                    setLoading(false);
                }
            };

            return React.createElement("div", { className: "container" },
                React.createElement("div", { className: "header" },
                    React.createElement("a", { href: `../index.html?empId=${empId}`, className: "back-btn" }, React.createElement("i", { className: "ti ti-chevron-left" }), "返回主選單"),
                    React.createElement("div", { style: { fontSize: '12px' } }, React.createElement("span", { style: { color: 'var(--primary)' } }, "人員："), empId)
                ),
                React.createElement("div", { className: "logo-area" }, React.createElement("div", { style: { fontSize: '40px' } }, "🦅"), React.createElement("div", { className: "title-main" }, "事故報告填寫系統")),
                React.createElement("div", { className: "card" },
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-calendar-event" }), "日期與時間"),
                        React.createElement("div", { style: { display: 'flex', gap: '10px' } },
                            React.createElement("input", { type: "date", className: "input", value: formData.date, onChange: e => setFormData({...formData, date: e.target.value}) }),
                            React.createElement("input", { type: "time", className: "input", value: formData.time, onChange: e => setFormData({...formData, time: e.target.value}) })
                        )
                    ),
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-map-pin" }), "事故地點"),
                        React.createElement("input", { className: "input", placeholder: "例如：A棟大廳", value: formData.location, onChange: e => setFormData({...formData, location: e.target.value}) })
                    ),
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-category" }), "事故類別"),
                        React.createElement("select", { className: "input", value: formData.category, onChange: e => setFormData({...formData, category: e.target.value}) },
                            ["一般事故", "竊盜事件", "爭執糾紛", "設備故障", "意外受傷", "火警通報", "其他"].map(c => React.createElement("option", { key: c, value: c }, c))
                        )
                    ),
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-file-description" }), "事故經過"),
                        React.createElement("textarea", { className: "textarea", placeholder: "請詳細描述經過...", value: formData.description, onChange: e => setFormData({...formData, description: e.target.value}) })
                    ),
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-camera" }), "現場照片 (最多3張)"),
                        React.createElement("div", { className: "photo-grid" },
                            [0,1,2].map(i => 
                                React.createElement("label", { key: i, className: "photo-box" },
                                    photos[i] ? React.createElement("img", { src: photos[i] }) : React.createElement(React.Fragment, null, React.createElement("i", { className: "ti ti-plus" }), React.createElement("span", null, "上傳")),
                                    React.createElement("input", { type: "file", accept: "image/*", style: { display: 'none' }, onChange: e => handleFileChange(i, e) })
                                )
                            )
                        )
                    )
                ),
                React.createElement("button", { className: "btn-submit", onClick: handleSubmit, disabled: loading },
                    loading ? React.createElement("i", { className: "ti ti-loader-2 spin" }) : React.createElement("i", { className: "ti ti-send" }),
                    loading ? "正在處理照片與資料..." : "提交事故報告"
                )
            );
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = type === 'success' ? '#22C55E' : '#E53E3E';
            toast.style.color = '#fff';
            toast.innerHTML = `<i class="ti ti-${type === 'success' ? 'check' : 'alert-circle'}"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
