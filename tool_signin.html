<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>過夜車輛登記 · 天鷹保全</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
const WORKFLOW_GAS_URL='https://script.google.com/macros/s/AKfycbzxjedGAbxj3G85zkybqoFoB-P7uQ9ycqdJZ7mzQ2Ax-vaxKgOTG60120PlGPbcNJpR/exec';
function logWorkflow(tool,actionType,status){
  var u=JSON.parse(localStorage.getItem('hsh_session_user')||'{}');
  if(!u.empId)return;
  try{fetch(WORKFLOW_GAS_URL,{method:'POST',body:JSON.stringify({action:'logTask',tool,empId:u.empId,userName:u.name||'未知',actionType,status:status||'已完成'})});}catch(e){}
}</script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0A0C10;font-family:'Microsoft JhengHei','PingFang TC',sans-serif;color:#F5F5F5;min-height:100vh;overflow-x:hidden}
    #splash{position:fixed;inset:0;background:#0A0C10;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
    #splash.hide{opacity:0;pointer-events:none}
    .sp-rings{position:relative;width:72px;height:72px}
    .sp-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;animation:spin 2.2s linear infinite}
    .sp-ring:nth-child(1){border-top-color:#D4A800}
    .sp-ring:nth-child(2){inset:8px;border-right-color:#FFD700;animation-duration:1.7s;animation-direction:reverse}
    .sp-ring:nth-child(3){inset:16px;border-bottom-color:#C9A227;animation-duration:1.3s}
    .sp-logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
    .sp-logo img{width:38px;height:38px;object-fit:contain}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sp-brand{font-size:18px;font-weight:900;color:#D4A800;letter-spacing:2px}
    .sp-sub{font-size:9px;color:#8A95A8;letter-spacing:3px}
    .app-hdr{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(10,12,16,.95);border-bottom:1px solid rgba(212,168,0,.2);position:sticky;top:0;z-index:100}
    .hdr-logo{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(212,168,0,.5));flex-shrink:0}
    .hdr-cn{font-size:14px;font-weight:900;color:#D4A800;letter-spacing:1px}
    .hdr-en{font-size:8px;color:#8A95A8;letter-spacing:2px;margin-top:1px}
    .screen{display:none;min-height:calc(100vh - 56px);padding:16px 16px 90px}
    .screen.active{display:block}
    .sec-lbl{font-size:11px;color:#8A95A8;letter-spacing:2px;margin-bottom:12px}
    .reg-card{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
    .reg-card:active{transform:scale(.98)}
    .reg-card.moto{border-color:rgba(212,168,0,.3)}
    .reg-card.car{border-color:rgba(129,140,248,.3)}
    .reg-card.park{border-color:rgba(74,222,128,.3)}
    .ci{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
    .moto .ci{background:rgba(212,168,0,.15);color:#FFD700}
    .car .ci{background:rgba(129,140,248,.15);color:#818CF8}
    .park .ci{background:rgba(74,222,128,.15);color:#4ADE80}
    .cb{flex:1}.cn{font-size:16px;font-weight:700;margin-bottom:3px}.cd{font-size:12px;color:#8A95A8}
    .ca{color:#4B5563;font-size:18px}
    .scr-ttl{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .back-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#F5F5F5;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0}
    .scr-ttl-txt{font-size:17px;font-weight:800}
    .type-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:20px;font-size:13px;font-weight:700}
    .type-badge.moto{background:rgba(212,168,0,.15);color:#FFD700;border:1px solid rgba(212,168,0,.3)}
    .type-badge.car{background:rgba(129,140,248,.15);color:#818CF8;border:1px solid rgba(129,140,248,.3)}
    .type-badge.park{background:rgba(74,222,128,.15);color:#4ADE80;border:1px solid rgba(74,222,128,.3)}
    /* ── 連拍統計列 ── */
    .stat-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;margin:12px 0}
    .stat-num{font-size:22px;font-weight:900;color:#4ADE80}
    .stat-lbl{font-size:11px;color:#8A95A8}
    /* ── 大型拍照按鈕 ── */
    .big-cam{width:100%;background:linear-gradient(135deg,#C9A227,#D4A800);border:none;border-radius:18px;padding:26px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .15s;-webkit-tap-highlight-color:transparent;box-shadow:0 6px 24px rgba(212,168,0,.25)}
    .big-cam:active{transform:scale(.97)}
    .big-cam:disabled{opacity:.5}
    .big-cam .ic{font-size:44px;color:#0A0C10}
    .big-cam .tx{font-size:18px;font-weight:900;color:#0A0C10;letter-spacing:1px}
    .big-cam .sb{font-size:11px;color:rgba(10,12,16,.65)}
    /* ── 手動輸入車牌連結（拍照按鈕下方，不用等辨識失敗才能手動輸入）── */
    .manual-link{width:100%;background:transparent;border:none;color:#818CF8;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;padding:12px;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent}
    .manual-link:active{opacity:.6}
    /* ── 處理中遮罩卡 ── */
    .proc-card{background:rgba(129,140,248,.07);border:1px solid rgba(129,140,248,.25);border-radius:14px;padding:18px;margin-top:14px;display:none}
    .proc-card.show{display:block}
    .proc-row{display:flex;align-items:center;gap:12px}
    .proc-thumb{width:64px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}
    .proc-info{flex:1}
    .proc-lbl{font-size:13px;color:#818CF8;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:6px}
    .spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid transparent;border-top-color:#818CF8;animation:spin .8s linear infinite}
    .proc-bar-w{background:rgba(255,255,255,.06);border-radius:4px;height:4px;overflow:hidden}
    .proc-bar{height:100%;background:linear-gradient(90deg,#6366F1,#818CF8);transition:width .4s;width:0%}
    /* ── 確認卡（辨識結果）── */
    .cfm-card{background:rgba(74,222,128,.06);border:2px solid rgba(74,222,128,.35);border-radius:16px;padding:18px;margin-top:14px;display:none;animation:popIn .25s ease}
    .cfm-card.show{display:block}
    @keyframes popIn{from{opacity:0;transform:scale(.95)}}
    .cfm-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .cfm-thumb{width:72px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}
    .cfm-plate-wrap{flex:1}
    .cfm-plate{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:8px 10px;font-size:26px;font-weight:900;letter-spacing:3px;text-align:center;color:#FFD700;font-family:inherit;outline:none;text-transform:uppercase;-webkit-appearance:none}
    .cfm-plate:focus{border-color:#FFD700}
    .cfm-count{font-size:11px;color:#4ADE80;text-align:center;margin-bottom:10px;font-weight:600}
    .cfm-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
    .cfm-cancel{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#F87171;border-radius:11px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
    .cfm-ok{background:linear-gradient(135deg,#16A34A,#22C55E);border:none;color:#fff;border-radius:11px;padding:13px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;position:relative;overflow:hidden}
    .cfm-ok .auto-fill{position:absolute;inset:0;background:rgba(255,255,255,.22);transform-origin:left;transform:scaleX(0)}
    .cfm-ok .ok-txt{position:relative;z-index:1;display:flex;align-items:center;gap:6px}
    /* ── 錯誤卡 ── */
    .err-card{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.3);border-radius:14px;padding:16px;margin-top:14px;display:none}
    .err-card.show{display:block}
    .err-card.manual{background:rgba(129,140,248,.07);border-color:rgba(129,140,248,.3)}
    .err-card.manual .err-lbl{color:#818CF8}
    .err-lbl{font-size:13px;color:#F87171;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
    .err-input-row{display:flex;gap:8px}
    .err-plate{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px;font-size:20px;font-weight:800;letter-spacing:2px;text-align:center;color:#FFD700;font-family:inherit;outline:none;text-transform:uppercase;-webkit-appearance:none}
    .err-send{background:linear-gradient(135deg,#16A34A,#22C55E);border:none;color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;flex-shrink:0}
    /* ── 最近登記列表 ── */
    .recent-list{margin-top:18px}
    .recent-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 14px;margin-bottom:8px;animation:slideIn .3s ease}
    @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}}
    .recent-plate{font-size:16px;font-weight:800;letter-spacing:2px;color:#F5F5F5;flex:1}
    .recent-time{font-size:11px;color:#6B7280}
    .recent-ok{color:#4ADE80;font-size:15px}
    .recent-fail{color:#FB923C;font-size:15px}
    .recent-edit{background:none;border:none;color:#818CF8;font-size:16px;cursor:pointer;padding:8px;flex-shrink:0;-webkit-tap-highlight-color:transparent}
    .recent-edit:active{opacity:.6}
    .recent-edit-inp{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid rgba(255,215,0,.35);border-radius:6px;padding:5px 8px;font-size:16px;font-weight:800;letter-spacing:2px;color:#FFD700;font-family:inherit;outline:none;text-transform:uppercase;-webkit-appearance:none}
    /* divider/ms */
    .divider{display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:#4B5563;font-size:11px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
    .btn-ms{width:100%;background:rgba(0,120,212,.08);border:1px solid rgba(0,120,212,.25);color:#60a5fa;border-radius:12px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
    .nav-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(10,12,16,.96);border-top:1px solid rgba(255,255,255,.07);z-index:200}
    .nav-btn{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#8A95A8;display:flex;align-items:center;justify-content:center;gap:8px}
    .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(30,34,42,.96);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;z-index:9000;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:toastIn .25s ease}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}}
    .page-footer{font-size:10px;color:#4B5563;letter-spacing:1px;text-align:center;padding:8px 0 16px}
  </style>
</head>
<body>

<div id="splash">
  <div class="sp-rings">
    <div class="sp-ring"></div><div class="sp-ring"></div><div class="sp-ring"></div>
    <div class="sp-logo"><img id="spLogo" src="" alt=""/></div>
  </div>
  <div class="sp-brand">天鷹保全</div>
  <div class="sp-sub">TIANYING SECURITY · DATA SYSTEM</div>
</div>

<header class="app-hdr">
  <img id="hdrLogo" class="hdr-logo" src="" alt=""/>
  <div><div class="hdr-cn"><span style="color:#FFD700">天鷹</span>保全</div><div class="hdr-en">OVERNIGHT VEHICLE REGISTRATION</div></div>
</header>

<!-- S0: 類型選擇 -->
<div id="s0" class="screen active" style="padding-top:20px">
  <div class="sec-lbl">選擇登記項目</div>
  <div class="reg-card moto" onclick="openCam('moto')">
    <div class="ci"><i class="ti ti-motorbike"></i></div>
    <div class="cb"><div class="cn">館內機車</div><div class="cd">連續拍照快速登記</div></div>
    <div class="ca"><i class="ti ti-chevron-right"></i></div>
  </div>
  <div class="reg-card car" onclick="openCam('car')">
    <div class="ci"><i class="ti ti-car"></i></div>
    <div class="cb"><div class="cn">館內汽車</div><div class="cd">連續拍照快速登記</div></div>
    <div class="ca"><i class="ti ti-chevron-right"></i></div>
  </div>
  <div class="reg-card park" onclick="openCam('park')">
    <div class="ci"><i class="ti ti-parking"></i></div>
    <div class="cb"><div class="cn">新莊停車場</div><div class="cd">連續拍照快速登記</div></div>
    <div class="ca"><i class="ti ti-chevron-right"></i></div>
  </div>
  <div class="divider">備用 · Microsoft 表單</div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
    <a class="btn-ms" href="https://forms.cloud.microsoft/r/QGHn5SQ0en?origin=lprLink" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>機車 · Microsoft 表單</a>
    <a class="btn-ms" href="https://forms.cloud.microsoft/r/Mcf0VUYBX7?origin=lprLink" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>汽車 · Microsoft 表單</a>
    <a class="btn-ms" href="https://forms.cloud.microsoft/r/WHzPK2maLC" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>停車場 · Microsoft 表單</a>
  </div>
</div>

<!-- S1: 連拍登記 -->
<div id="s1" class="screen">
  <div class="scr-ttl">
    <button class="back-btn" onclick="showS(0)"><i class="ti ti-arrow-left"></i></button>
    <span class="scr-ttl-txt">快速連拍登記</span>
    <span id="typeBadge" class="type-badge moto" style="margin-left:auto"></span>
  </div>

  <!-- 統計 -->
  <div class="stat-bar">
    <div><div class="stat-num" id="statCount">0</div><div class="stat-lbl">本次已登記</div></div>
    <div style="text-align:right"><div style="font-size:13px;color:#8A95A8" id="statLast">—</div><div class="stat-lbl">最後車牌</div></div>
  </div>

  <!-- 大拍照按鈕 -->
  <button class="big-cam" id="bigCam" onclick="triggerCam()">
    <span class="ic"><i class="ti ti-camera"></i></span>
    <span class="tx">拍攝車牌</span>
    <span class="sb">拍照後 AI 自動辨識並登記</span>
  </button>
  <button class="manual-link" onclick="showManualEntry()"><i class="ti ti-keyboard"></i> 手動輸入車牌</button>

  <!-- 處理中 -->
  <div class="proc-card" id="procCard">
    <div class="proc-row">
      <img class="proc-thumb" id="procThumb" src="" alt=""/>
      <div class="proc-info">
        <div class="proc-lbl"><span class="spin"></span><span id="procLbl">AI 辨識中…</span></div>
        <div class="proc-bar-w"><div class="proc-bar" id="procBar"></div></div>
      </div>
    </div>
  </div>

  <!-- 確認卡：3秒自動送出 -->
  <div class="cfm-card" id="cfmCard">
    <div class="cfm-top">
      <img class="cfm-thumb" id="cfmThumb" src="" alt=""/>
      <div class="cfm-plate-wrap">
        <input type="text" class="cfm-plate" id="cfmPlate" autocomplete="off" autocorrect="off" spellcheck="false" oninput="onPlateEdit()"/>
      </div>
    </div>
    <div class="cfm-count" id="cfmCount">3 秒後自動登記，點車牌可修改</div>
    <div class="cfm-btns">
      <button class="cfm-cancel" onclick="cancelCfm()">取消</button>
      <button class="cfm-ok" onclick="confirmNow()">
        <span class="auto-fill" id="autoFill"></span>
        <span class="ok-txt"><i class="ti ti-check"></i> 立即登記</span>
      </button>
    </div>
  </div>

  <!-- 辨識失敗：手動輸入 -->
  <div class="err-card" id="errCard">
    <div class="err-lbl" id="errLbl"><i class="ti ti-alert-circle"></i> 辨識失敗，請手動輸入車牌</div>
    <div class="err-input-row">
      <input type="text" class="err-plate" id="errPlate" placeholder="BNZ-5205" autocomplete="off" oninput="this.value=this.value.toUpperCase()"/>
      <button class="err-send" onclick="sendManual()">登記</button>
    </div>
    <div id="errDebug" style="margin-top:8px;font-size:11px;line-height:1.5;color:#FB923C;word-break:break-all;font-family:monospace;"></div>
  </div>

  <!-- 最近登記 -->
  <div class="recent-list" id="recentList"></div>
</div>

<input type="file" id="camInp" accept="image/*" capture="environment" style="display:none"/>
<nav class="nav-bar"><button class="nav-btn" onclick="goBack()"><i class="ti ti-arrow-left"></i> 返回工具頁</button></nav>
<div id="toast" class="toast" style="display:none"></div>
<footer class="page-footer">© TIANYING SECURITY · INTERNAL SYSTEM</footer>

<script>
// ═══════ 設定 ═══════
var GAS_URL='https://script.google.com/macros/s/AKfycbwZ5f7h_Lv_MOCxPrqPpBPKA917-JKmEz5DDekYixLDsGf1QAKCTOuVxwo18OYKX7a4ng/exec';
// 車牌辨識獨立 GAS（recognizePlate 辨識 + vehicleReg 登記寫入，綁車輛登記試算表）；

// ═══════ LIFF 整合（綁定 LINE 通知用，可選功能） ═══════
// LIFF_ID：於 LINE Developers Console → LIFF → 新增 App 後取得
// 格式如 '1234567890-abcdefgh'，若尚未設定請保持空字串（不影響原有功能）
var LIFF_ID = '2010392723-Pl8dPArQ';

// 優先序：URL ?empId= 參數 > LIFF 自動帶入（依 LINE綁定 反查工號） > 無
// LIFF 初始化失敗、SDK 未載入或非 LINE 環境時靜默跳過，不影響一般瀏覽器開啟
if (LIFF_ID && !empId && typeof liff !== 'undefined') {
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      // 未登入時不強制導向登入，避免一般瀏覽器誤觸發；僅在 LIFF 內嵌瀏覽器才會自動登入
      return;
    }
    return liff.getProfile();
  }).then(function (profile) {
    if (!profile || !profile.userId) return;
    // 依 LINE userId 反查綁定工號（GAS getLineBindings：批次查詢）
    return fetch(GAS_URL + '?action=getLineBindings')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.status !== 'ok' || !Array.isArray(data.list)) return;
        var matched = data.list.find(function (b) {
          return b.lineUserId === profile.userId && b.status === 'bound';
        });
        if (matched) {
          empId = matched.empId;
          // 將自動帶入的工號同步寫回 URL，供返回主頁時帶回工號狀態
          var url = new URL(window.location.href);
          url.searchParams.set('empId', empId);
          window.history.replaceState({}, '', url.toString());
        }
      });
  }).catch(function (err) {
    console.error('LIFF 初始化或綁定查詢失敗：' + err.toString());
  });
}

// ═══════ 圖片壓縮 ═══════
// 長邊縮到1000px+品質78%。2026-07-11 曾為加快辨識速度改成800px/70%，
// 但夜間近拍車牌（閃光燈打亮、背景全黑）壓縮後末位數字容易糊到AI看錯
// （2026-07-27 實際案例：MEZ-8235 被誤讀成 MEZ-823），改回此設定救準確度。
function compressImg(file){
  return new Promise(function(resolve){
    var url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      var MAX=1000;
      var sc=Math.min(1,MAX/Math.max(img.width,img.height));
      var cvs=document.createElement('canvas');
      cvs.width=Math.round(img.width*sc);cvs.height=Math.round(img.height*sc);
      cvs.getContext('2d').drawImage(img,0,0,cvs.width,cvs.height);
      resolve({dataUrl:cvs.toDataURL('image/jpeg',0.78),previewUrl:url});
    };
    img.src=url;
  });
}

// ═══════ AI 辨識（Gemini via GAS）═══════
async function startOCR(file){
  hideAllCards();
  var proc=document.getElementById('procCard');
  proc.classList.add('show');
  setBar(10);setLbl('壓縮圖片中…');

  try{
    var c=await compressImg(file);
    curThumbUrl=c.previewUrl;
    document.getElementById('procThumb').src=c.previewUrl;
    setBar(35);setLbl('AI 辨識中…');

    var res=await fetch(PLATE_GAS_URL,{method:'POST',body:JSON.stringify({action:'recognizePlate',imageBase64:c.dataUrl.split(',')[1],mimeType:'image/jpeg'})});
    setBar(90);
    var json=await res.json();
    setBar(100);
    proc.classList.remove('show');

    var plate=(json.plate||'').trim().toUpperCase();
    if(json.success && plate && plate!=='無法辨識' && plate.length>=3){
      showCfm(plate);
    }else{
      showErr(json.success ? ('AI 回應：'+(json.plate||'(空)')+(json.raw?' ｜原始：'+String(json.raw).slice(0,200):'')) : ('HTTP '+res.status+' · '+(json.error||'未知錯誤')));
    }
  }catch(e){
    proc.classList.remove('show');
    showErr('連線失敗（fetch 例外）：'+(e&&e.message?e.message:e));
  }
}

function showCfm(plate){

  startCfmTimer();
}
function startCfmTimer(){
  clearCfmTimer();
  cfmDeadline=Date.now()+AUTO_SUBMIT_SEC*1000;
  var fill=document.getElementById('autoFill');
  fill.style.transition='transform '+AUTO_SUBMIT_SEC+'s linear';
  requestAnimationFrame(function(){fill.style.transform='scaleX(1)';});
  cfmTimer=setInterval(function(){
    var remain=Math.ceil((cfmDeadline-Date.now())/1000);
    if(remain<=0){confirmNow();return;}
    document.getElementById('cfmCount').textContent=remain+' 秒後自動登記，點車牌可修改';
  },200);
}
function clearCfmTimer(){
  if(cfmTimer){clearInterval(cfmTimer);cfmTimer=null;}
  var fill=document.getElementById('autoFill');
  fill.style.transition='none';fill.style.transform='scaleX(0)';
}

function doSubmit(plate){
  // 樂觀 UI：先進列表，後台送出
  sessCount++;
  document.getElementById('statCount').textContent=sessCount;
  document.getElementById('statLast').textContent=plate;
  var itemId='r'+Date.now();
  var typeLabel=TYPE_INFO[curType].label;
  var list=document.getElementById('recentList');
  var div=document.createElement('div');
  div.className='recent-item';div.id=itemId;
  div.dataset.type=typeLabel;
  div.innerHTML='<span class="recent-plate" id="'+itemId+'-txt">'+plate+'</span><span class="recent-time">'+new Date().toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit'})+'</span><span class="recent-ok" id="'+itemId+'-st"><span class="spin" style="width:12px;height:12px;border-top-color:#4ADE80"></span></span>';
  list.insertBefore(div,list.firstChild);

  // 背景送出（日期時間 = 送出當下，GAS端自動填）
  fetch(PLATE_GAS_URL,{method:'POST',body:JSON.stringify({action:'vehicleReg',type:curType,typeLabel:typeLabel,plate:plate,operator:empName||empId||'未登入'})})
    .then(function(r){return r.json();})
    .then(function(j){
      var st=document.getElementById(itemId+'-st');
      if(j.success){
        if(st) st.innerHTML='<i class="ti ti-check"></i>';
        div.dataset.row=j.row; // 有row才能編輯，避免修改到還沒寫入成功的假資料
        addEditBtn(itemId);
        logWorkflow('signin','vehicle-reg','已完成');
      }else{
        if(st) st.innerHTML='<i class="ti ti-alert-triangle" style="color:#FB923C"></i>';
        showToast('⚠️ '+plate+' 寫入失敗');
      }
    })
    .catch(function(){
      var st=document.getElementById(itemId+'-st');
      if(st) st.innerHTML='<i class="ti ti-wifi-off" style="color:#F87171"></i>';
      showToast('⚠️ '+plate+' 網路錯誤');
    });

  showToast('✅ '+plate+' 已登記');
}

// ═══════ 最近登記：辨識錯誤時就地編輯（不用開試算表手改）═══════
function addEditBtn(itemId){
  var div=document.getElementById(itemId);
  if(!div||div.querySelector('.recent-edit'))return;
  var btn=document.createElement('button');
  btn.className='recent-edit';btn.title='修改車牌';
  btn.innerHTML='<i class="ti ti-pencil"></i>';
  btn.onclick=function(){editRecent(itemId);};
  div.insertBefore(btn,document.getElementById(itemId+'-st'));
}
function editRecent(itemId){
  var div=document.getElementById(itemId);
  if(!div||!div.dataset.row)return; // 還沒拿到列號（寫入還沒成功）不給編輯
  var txt=document.getElementById(itemId+'-txt');
  var oldPlate=txt.textContent;
  var inp=document.createElement('input');
  inp.type='text';inp.className='recent-edit-inp';inp.id=itemId+'-txt';inp.value=oldPlate;
  inp.autocomplete='off';inp.autocorrect='off';inp.spellcheck=false;
  inp.oninput=function(){inp.value=inp.value.toUpperCase();};
  inp.onkeydown=function(e){if(e.key==='Enter')saveRecentEdit(itemId,oldPlate);};
  txt.replaceWith(inp);
  inp.focus();inp.select();
  var editBtn=div.querySelector('.recent-edit');
  editBtn.innerHTML='<i class="ti ti-check"></i>';
  editBtn.onclick=function(){saveRecentEdit(itemId,oldPlate);};
}
function saveRecentEdit(itemId,oldPlate){
  var div=document.getElementById(itemId);
  var inp=document.getElementById(itemId+'-txt');
  var newPlate=inp.value.trim().toUpperCase();
  if(!newPlate){showToast('⚠️ 車牌不可為空');return;}
  var span=document.createElement('span');
  span.className='recent-plate';span.id=itemId+'-txt';span.textContent=newPlate;
  inp.replaceWith(span);
  var editBtn=div.querySelector('.recent-edit');
  editBtn.innerHTML='<i class="ti ti-pencil"></i>';
  editBtn.onclick=function(){editRecent(itemId);};
  if(newPlate===oldPlate)return; // 沒改內容就不用打回後端

  var st=document.getElementById(itemId+'-st');
  if(st) st.innerHTML='<span class="spin" style="width:12px;height:12px;border-top-color:#818CF8"></span>';
  fetch(PLATE_GAS_URL,{method:'POST',body:JSON.stringify({action:'updatePlate',typeLabel:div.dataset.type,row:div.dataset.row,plate:newPlate})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(st) st.innerHTML=j.success?'<i class="ti ti-check"></i>':'<i class="ti ti-alert-triangle" style="color:#FB923C"></i>';
      showToast(j.success?('✅ 已更新為 '+newPlate):('⚠️ 更新失敗：'+(j.error||'未知錯誤')));
    })
    .catch(function(){
      if(st) st.innerHTML='<i class="ti ti-wifi-off" style="color:#F87171"></i>';
      showToast('⚠️ 網路錯誤，更新失敗');
    });
}

var _tt;
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(_tt);_tt=setTimeout(function(){el.style.display='none';},2200);}
function goBack(){
  if(window.self!==window.top){try{var b=window.top.document.getElementById('hsh-tool-back-btn');if(b){b.click();return;}}catch(e){}}
  if(window.history.length>1)window.history.back();
}
</script>
