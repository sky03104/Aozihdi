<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;min-height:100vh;}
.container{max-width:960px;margin:0 auto;padding:16px 14px 60px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.back-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:13px 16px;border-radius:10px;text-decoration:none;display:flex;align-items:center;gap:6px;font-size:14px;min-height:44px;}
.title-wrap{text-align:center;flex:1;min-width:200px;}

.tab-btn.active{background:linear-gradient(135deg,#D4A800 0%,#FFD700 100%);color:#000;border-color:transparent;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;backdrop-filter:blur(10px);max-width:100%;overflow-x:auto;}
.card-title{font-size:15px;font-weight:700;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px;}

<body>
<div id="root"></div>
<script>
const { useState, useEffect, useMemo } = React;
const h = React.createElement;

/* ══════════════════════ 基礎：工號狀態 ══════════════════════ */
const params = new URLSearchParams(window.location.search);
let EMP_ID = params.get('empId') || '';
if (!EMP_ID) { try { EMP_ID = (JSON.parse(localStorage.getItem('hsh_session_user') || '{}').empId) || ''; } catch (e) {} }
if (!EMP_ID) EMP_ID = '未登入';
function backUrl(){ return 'index.html?empId=' + encodeURIComponent(EMP_ID); }

/* ══════════════════════ GAS 連線設定 ══════════════════════ */
// 部署後把 /exec 網址填在這裡（見 哨表產生_GAS_部署說明.md）
const GUARD_GEN_GAS_URL = 'https://script.google.com/macros/s/AKfycbzGCuMUEksvU88-WdoJ6DhJ0zOkQi8zC7x7zXIfVOvLW0dOs7s9bCW1sCF1Ij2rGDr63Q/exec';
// 哨表上傳走既有「哨表上傳_GAS_v6.gs」，沿用 tool_upload.html 已部署好的網址
const GD_UPLOAD_GAS_URL = 'https://script.google.com/macros/s/AKfycbwl9hcbbuKBHWmleftzbbaiUihhsHVK4H0dKMd-LrCQwRE3aUPpIHlwWLcGZbhqugp_gg/exec';

async function callGuardGas(action, data) {
  try {
    const res = await fetch(GUARD_GEN_GAS_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action, empId: EMP_ID }, data || {}))
    });
    const txt = await res.text();
    try { return JSON.parse(txt); } catch (e) { return { status: 'error', msg: '回應格式錯誤：' + txt.slice(0, 120) }; }
  } catch (e) {
    return { status: 'error', msg: '連線失敗：' + e.message };
  }
}

/* ══════════════════════ 哨點定義（單一資料源）══════════════════════
   POST_DEFS 同時負責「標籤文字」與「姓名值要寫入的位置」，是唯一的版型座標定義。
   規律：label 永遠寫在 col-1（同一列往左一欄），value 寫在 col。
   buildBaseRows() 迴圈這份定義產生固定標籤；buildGuardMatrix() 迴圈它做隨機分配。
   conditional 的項目（目前只有南側門）標籤不進 buildBaseRows，改成勾選當天才動態補上。
   MERGE_RANGES（見下方 xlsx 匯出段落）是「合併儲存格範圍」，跟這裡的 row/col 定位用途不同，
   純粹是視覺上的儲存格合併，不需要跟 POST_DEFS 同步，但改版型時兩邊都要對照確認。
════════════════════════════════════════════════════════════════════ */
const POST_DEFS = [
  { key: '警衛室',       label: '警衛室',           row: 3,  col: 2,  shift: 'early' },
  { key: '漢來飯店',     label: '漢來\n飯店',       row: 4,  col: 2,  shift: 'early', forcedCodes: { 'H': '1100-2200', 'H2': '1100-2330' } },
  { key: 'P3車道',       label: 'P3\n車道',         row: 6,  col: 2,  shift: 'early' },
  { key: '南側門',       label: '南側門',           row: 7,  col: 2,  shift: 'early', conditional: 'southGate', forcedCode: '南' },
  { key: 'B1F警衛室',    label: 'B1F\n警衛室',      row: 3,  col: 5,  shift: 'early' },
  { key: '機動人員1',    label: '機動\n人員1',      row: 4,  col: 5,  shift: 'early' },
  { key: '物流車道',     label: '物流\n車道',       row: 6,  col: 5,  shift: 'early' },
  { key: '機動人員2',    label: '機動\n人員2',      row: 7,  col: 5,  shift: 'early' },
  { key: '晚班警衛室',   label: '警衛室',           row: 3,  col: 9,  shift: 'late' },
  { key: '晚班B1F警衛室',label: 'B1F\n警衛室',      row: 6,  col: 9,  shift: 'late' },
  { key: '晚班P3車道',   label: 'P3車道\n(廣場哨)', row: 7,  col: 9,  shift: 'late' },
  { key: '晚班漢來飯店', label: '漢來\n飯店',       row: 3,  col: 12, shift: 'late', linked: '漢來飯店' }, // 早/晚班漢來飯店是同一人跨時段駐守，不獨立抽人，見 buildGuardMatrix
  { key: '晚班機動人員', label: '機動\n人員',       row: 6,  col: 12, shift: 'late' },
  { key: '海底撈',       label: '海底撈',           row: 7,  col: 12, shift: 'late', forcedCode: '海' },
  { key: '巡檢1',        label: '巡檢1',            row: 10, col: 2,  shift: 'early' },
  { key: '巡檢2',        label: '巡檢2',            row: 11, col: 2,  shift: 'early' },
  { key: '巡檢3',        label: '巡檢3',            row: 12, col: 2,  shift: 'early' },
  { key: '停巡4',        label: '停巡4',            row: 13, col: 2,  shift: 'early' },
  { key: '停巡5',        label: '停巡5',            row: 14, col: 2,  shift: 'early' },
  { key: '停巡6',        label: '停巡6',            row: 15, col: 2,  shift: 'early' },
  { key: '停巡7',        label: '停巡7\n(廣場哨)',  row: 16, col: 2,  shift: 'early' },
  { key: '晚班巡檢1',    label: '巡檢1',            row: 10, col: 9,  shift: 'late' },
  { key: '晚班巡檢2',    label: '巡檢2',            row: 11, col: 9,  shift: 'late' },
  { key: '晚班巡檢3',    label: '巡檢3',            row: 12, col: 9,  shift: 'late' },
  { key: '晚班停巡4',    label: '停巡4',            row: 13, col: 9,  shift: 'late' },
  { key: '晚班停巡5',    label: '停巡5',            row: 14, col: 9,  shift: 'late' },
  { key: '晚班停巡6',    label: '停巡6',            row: 15, col: 9,  shift: 'late' },
];
const POST_KEYS = POST_DEFS.map(p => p.key);
// 帶班幹部不是隨機分配的崗位（不進 POST_DEFS），只是「哨點設定」裡的資格標籤，
// 用來過濾「產生哨表」畫面的帶班幹部下拉選單選項。
const LEADER_KEYS = { early: '早班帶班幹部', late: '晚班帶班幹部' };
const POST_GROUPS = [
  { label: '早班一般崗位', keys: ['警衛室', '漢來飯店', 'P3車道', '南側門'] },
  { label: '早班特殊崗位', keys: ['B1F警衛室', '機動人員1', '物流車道', '機動人員2'] },
  { label: '早班巡檢/停巡', keys: ['巡檢1', '巡檢2', '巡檢3', '停巡4', '停巡5', '停巡6', '停巡7'] },
  // 晚班漢來飯店不在這裡：跟早班漢來飯店是同一人（linked），不獨立設定資格
  { label: '晚班崗位', keys: ['晚班警衛室', '晚班B1F警衛室', '晚班P3車道', '晚班機動人員', '海底撈'] },
  { label: '晚班巡檢/停巡', keys: ['晚班巡檢1', '晚班巡檢2', '晚班巡檢3', '晚班停巡4', '晚班停巡5', '晚班停巡6'] },
  { label: '帶班幹部（產生哨表時下拉選單用）', keys: [LEADER_KEYS.early, LEADER_KEYS.late] },
];
const WEEKDAY_ZH = ['日', '一', '二', '三', '四', '五', '六'];

/* ══════════════════════ 哨點設定資料格式：'key' 或 'key|優先序數字'（數字越小越優先）══════════════════════
   儲存與傳輸格式不變（逗號分隔字串），只是每個項目多了可選的 |數字 後綴，GAS端完全不需要改，
   對它來說仍然是不透明字串。
════════════════════════════════════════════════════════════════════ */
function parsePostEntry(s) {
  const i = s.indexOf('|');
  if (i === -1) return { key: s, priority: null };
  const p = parseInt(s.slice(i + 1), 10);
  return { key: s.slice(0, i), priority: isNaN(p) ? null : p };
}
function hasQual(list, key) {
  return (list || []).some(s => parsePostEntry(s).key === key);
}
function priorityFor(list, key) {
  const e = (list || []).map(parsePostEntry).find(e => e.key === key);
  return e ? e.priority : null;
}
// 有標優先序的排前面（數字小優先）、其餘隨機排在後面，同優先序之間也隨機
function pickByPriority(cands, postConfig, key) {
  // 排序前先洗牌：Array.sort 是穩定排序，同優先序（含都沒設）的人要靠洗牌過的順序才會真的隨機，
  // 不然永遠固定選到「原始陣列裡排比較前面」的那個人。
  const ranked = shuffle(cands.filter(p => priorityFor(postConfig[p.name], key) != null))
    .sort((a, b) => priorityFor(postConfig[a.name], key) - priorityFor(postConfig[b.name], key));
  const unranked = shuffle(cands.filter(p => priorityFor(postConfig[p.name], key) == null));
  return ranked.concat(unranked)[0];
}
const DEFAULT_TIME = { early: '0800-2000', late: '2000-0800' };

/* ══════════════════════ 18×14 固定文字標籤（每次產生都先寫入，動態內容之後再覆蓋值格）══════════════════════ */
function buildBaseRows() {
  const rows = [];
  for (let r = 0; r < 18; r++) rows.push(new Array(14).fill(''));
  rows[1][0] = '                   姓名\n  哨位';
  rows[1][2] = '早班人員:   08:00~20:00';
  rows[1][8] = '晚班人員:  20:00~08:00';
  rows[2][2] = ' 帶隊幹部 : ';
  rows[2][8] = '帶隊幹部 : ';
  rows[3][0] = '外圍';
  rows[10][0] = '巡檢';
  // 崗位標籤全部改由 POST_DEFS 驅動（label 永遠寫在 col-1），conditional 的哨位（南側門）不在這裡寫，
  // 等勾選當天才在 buildGuardMatrix() 動態補上，維持單一資料源。
  POST_DEFS.forEach(def => {
    if (def.conditional) return;
    rows[def.row][def.col - 1] = def.label;
  });
  rows[17][1] = '13人/12HR+8HR(0800-1600)\n增派12HR(1100-2300)+8HR(1200-2000)';
  rows[17][8] = '11人/12HR+8HR(2200-0600)\n               增派4HR(0600-1000)';
  return rows;
}

/* ══════════════════════ 核心：18×14 值陣列產生邏輯（純函式，不碰 DOM，可獨立測試） ══════════════════════ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildGuardMatrix(opts) {
  const { year, month, day, weekdayIdx, earlyRoster, lateRoster, postConfig,
    southGate, patrolExtra, parkExtra, stopPatrolExtra, parkNames, leaderEarly, leaderLate } = opts;
  const rows = buildBaseRows();
  const warnings = [];
  const forcedWarnings = [];

  rows[0][0] = String(year - 1911) + '年';
  rows[0][3] = String(month);
  rows[0][5] = String(day);
  rows[0][7] = WEEKDAY_ZH[weekdayIdx] || '';
  rows[0][8] = '天鷹保全駐漢神巨蛋商場、外圍每日執勤人員名單';

  // 帶隊幹部（下拉選單挑人，但選單只依哨點設定資格列人，沒對照當天月班表——
  // 這裡補查：選定的人當天若不在早/晚班在職名單裡，還是照填，但要跳出強制警告，
  // 不能讓幹部誤選到當天沒上班的人卻毫無提示）
  if (leaderEarly) {
    rows[2][4] = leaderEarly + '\n' + DEFAULT_TIME.early;
    if (!earlyRoster.some(p => p.name === leaderEarly)) {
      forcedWarnings.push('早班帶隊幹部「' + leaderEarly + '」當天不在早班在職名單裡，請確認是否選錯人');
    }
  }
  if (leaderLate) {
    rows[2][11] = leaderLate + '\n' + DEFAULT_TIME.late;
    if (!lateRoster.some(p => p.name === leaderLate)) {
      forcedWarnings.push('晚班帶隊幹部「' + leaderLate + '」當天不在晚班在職名單裡，請確認是否選錯人');
    }
  }

  // ── 拆分早班：見習 / L / LN / N / 南（南側門專職）/ H・H2（漢來飯店專職）/ 一般池 ──
  const earlyTrainees = earlyRoster.filter(p => (p.code || '').indexOf('見') >= 0);
  const earlyL = earlyRoster.filter(p => p.code === 'L');
  const earlyLN = earlyRoster.filter(p => p.code === 'LN');
  const earlyN = earlyRoster.filter(p => p.code === 'N');
  const earlySouth = earlyRoster.filter(p => p.code === '南');
  const HANLAI_CODE_TIME = { 'H': '1100-2200', 'H2': '1100-2330' }; // H/H2代號本身就代表早晚班漢來飯店同一人，兩者互斥（同一天只會有其中一種）
  const earlyHanlai = earlyRoster.filter(p => HANLAI_CODE_TIME[p.code]);
  const earlyExclude = new Set(earlyTrainees.concat(earlyL, earlyLN, earlyN, earlySouth, earlyHanlai).map(p => p.name));
  if (leaderEarly) earlyExclude.add(leaderEarly); // 被排為早班帶班幹部的人，不再進入其他哨點的隨機分配池
  const earlyPoolBase = earlyRoster.filter(p => !earlyExclude.has(p.name));

  // L/LN/N/南 班的人不會被塞回一般崗位池（維持原意圖：他們的工作就是巡檢/停巡增派/南側門），
  // 但沒勾對應 checkbox 時人會無聲消失，所以強制跳出醒目警告點名，不能只靠一般警告清單。
  earlyL.forEach(p => {
    if (!patrolExtra) forcedWarnings.push(p.name + ' 是 L 班，但未勾選「巡檢增派」，此人尚未被排入本次哨表');
  });
  earlyLN.forEach(p => {
    if (!patrolExtra) forcedWarnings.push(p.name + ' 是 LN 班，但未勾選「巡檢增派」，此人的巡檢增派時段尚未排入');
    if (!stopPatrolExtra) forcedWarnings.push(p.name + ' 是 LN 班，但未勾選「停巡增派」，此人的停巡增派時段尚未排入');
  });
  earlyN.forEach(p => {
    if (!stopPatrolExtra) forcedWarnings.push(p.name + ' 是 N 班，但未勾選「停巡增派」，此人尚未被排入本次哨表');
  });
  earlySouth.forEach(p => {
    if (!southGate) forcedWarnings.push(p.name + ' 是「南」班，代表當天要開南側門哨，但你沒有勾選「南側門」，此人尚未被排入本次哨表');
  });

  // ── 拆分晚班：見習 / 海（海底撈專職）/ 一般池 ──
  const lateTrainees = lateRoster.filter(p => (p.code || '').indexOf('見') >= 0);
  const lateSea = lateRoster.filter(p => p.code === '海');
  const lateExclude = new Set(lateTrainees.concat(lateSea).map(p => p.name));
  if (leaderLate) lateExclude.add(leaderLate); // 被排為晚班帶班幹部的人，不再進入其他哨點的隨機分配池
  const latePoolBase = lateRoster.filter(p => !lateExclude.has(p.name));

  // ── 一般崗位／巡檢隨機分配：貪婪分配結果會因為隨機順序不穩定（同一份資料重跑，
  // 有時排得滿、有時排不滿），改成多輪重試、取「分配失敗人數最少」的一輪，
  // 不做完整二分圖最大匹配（過度設計），是輕量改善。
  function tryAssignOnce(order) {
    const earlyPool = earlyPoolBase.slice();
    const latePool = latePoolBase.slice();
    const picks = {};
    const failedKeys = [];
    order.forEach(def => {
      if (def.conditional === 'southGate' && !southGate) return;
      if (def.linked) return; // 跟另一個崗位連動同一人，不獨立抽（見下方 linked 補值邏輯）
      if (def.forcedCode) {
        // 月班表當天若有人代號剛好吻合（例如南/海），這崗位就是他專職，不跑隨機池
        // （見下方 forcedCode 補值邏輯）；沒人代號吻合才照舊走隨機分配
        const roster = def.shift === 'early' ? earlyRoster : lateRoster;
        if (roster.some(p => p.code === def.forcedCode)) return;
      }
      if (def.forcedCodes) {
        // 同上，但一個崗位對應多種可能代號（例如漢來飯店的 H/H2），見下方 H/H2 補值邏輯
        const roster = def.shift === 'early' ? earlyRoster : lateRoster;
        if (roster.some(p => def.forcedCodes[p.code])) return;
      }
      const pool = def.shift === 'early' ? earlyPool : latePool;
      const cands = pool.filter(p => hasQual(postConfig[p.name], def.key));
      if (!cands.length) { picks[def.key] = null; failedKeys.push(def.key); return; }
      const picked = pickByPriority(cands, postConfig, def.key);
      pool.splice(pool.indexOf(picked), 1);
      picks[def.key] = picked;
    });
    return { picks, failedKeys, earlyPool, latePool, score: failedKeys.length + earlyPool.length + latePool.length };
  }
  let best = null;
  for (let attempt = 0; attempt < 5; attempt++) {
    const result = tryAssignOnce(shuffle(POST_DEFS));
    if (!best || result.score < best.score) best = result;
    if (best.score === 0) break;
  }
  POST_DEFS.forEach(def => {
    if (def.conditional === 'southGate' && !southGate) return;
    if (def.conditional) rows[def.row][def.col - 1] = def.label; // 勾選當天才補上條件式標籤（例如南側門）
    const picked = best.picks[def.key];
    if (picked) rows[def.row][def.col] = picked.name + '\n' + DEFAULT_TIME[def.shift];
  });
  best.failedKeys.forEach(key => warnings.push('崗位「' + key + '」找不到適任人選，需手動填寫'));
  const earlyPool = best.earlyPool, latePool = best.latePool;
  if (earlyPool.length) warnings.push('早班有排班但未分配到崗位：' + earlyPool.map(p => p.name).join('、'));
  if (latePool.length) warnings.push('晚班有排班但未分配到崗位：' + latePool.map(p => p.name).join('、'));

  // ── 漢來飯店 H/H2 代號：直接指定同一人早晚班都是他，時間用實際班別時段
  // （不是通用早/晚班預設時間），優先於下面的一般 linked 連動邏輯 ──
  const hanlaiForced = earlyHanlai[0]; // 同一天只會有一位（H/H2互斥），多位算異常資料，不特別擋
  if (hanlaiForced) {
    const t = HANLAI_CODE_TIME[hanlaiForced.code];
    rows[4][2] = hanlaiForced.name + '\n' + t;
    rows[3][12] = hanlaiForced.name + '\n' + t;
  }

  // ── linked 崗位：跟來源崗位是同一人跨時段駐守，直接沿用來源的分配結果，不獨立抽人 ──
  POST_DEFS.filter(d => d.linked).forEach(def => {
    if (def.linked === '漢來飯店' && hanlaiForced) return; // 已經用 H/H2 代號直接指定，不用這裡的一般連動邏輯
    const picked = best.picks[def.linked];
    if (!picked) { warnings.push('「' + def.key + '」跟「' + def.linked + '」是同一人，但早班尚未分配到人，需手動確認'); return; }
    if (!lateRoster.some(p => p.name === picked.name)) {
      warnings.push('「' + def.key + '」應與早班「' + def.linked + '」（' + picked.name + '）同一人，但他當天沒有晚班排班紀錄，需手動確認');
      return;
    }
    rows[def.row][def.col] = picked.name + '\n' + DEFAULT_TIME.late;
  });

  // ── forcedCode 崗位：月班表代號直接指定專職（南=南側門、海=海底撈），優先於一般隨機分配 ──
  POST_DEFS.filter(d => d.forcedCode).forEach(def => {
    const roster = def.shift === 'early' ? earlyRoster : lateRoster;
    const matches = roster.filter(p => p.code === def.forcedCode);
    if (!matches.length) return; // 沒人代號吻合，維持 best.picks 已經算好的一般隨機分配結果
    if (def.conditional === 'southGate' && !southGate) return; // 沒勾選，forcedWarnings 已經點名，這裡不寫入
    if (def.conditional) rows[def.row][def.col - 1] = def.label;
    if (matches.length > 1) warnings.push('「' + def.key + '」代號吻合（' + def.forcedCode + '班）的候選不只一位：' + matches.map(p => p.name).join('、') + '，僅自動帶入第一位，請確認');
    rows[def.row][def.col] = matches[0].name + '\n' + DEFAULT_TIME[def.shift];
  });

  // ── 巡檢增派（早班 L/LN） ──
  if (patrolExtra) {
    const cands = earlyL.concat(earlyLN);
    rows[10][4] = '巡檢增派';
    if (cands.length > 1) warnings.push('巡檢增派候選（L/LN班）不只一位：' + cands.map(p => p.name).join('、') + '，僅自動帶入第一位，請確認');
    if (cands.length) rows[10][5] = cands[0].name + '\n1200-2000';
    else warnings.push('找不到 L/LN 班人員，巡檢增派需手動填寫');
  }

  // ── 停巡增派（早班 LN 或 N） ──
  if (stopPatrolExtra) {
    const stopCands = earlyLN.concat(earlyN);
    rows[13][4] = '停巡增派';
    if (stopCands.length > 1) warnings.push('停巡增派候選（LN/N班）不只一位：' + stopCands.map(p => p.name).join('、') + '，僅自動帶入第一位，請確認');
    if (stopCands.length) rows[13][5] = stopCands[0].name + '\n2000-2400';
    else warnings.push('找不到 LN/N 班人員，停巡增派需手動填寫');
  }

  // ── 泊車增派（手動輸入2人，固定 1230-2030） ──
  if (parkExtra) {
    rows[11][4] = '泊車增派';
    rows[12][4] = '泊車增派';
    if (parkNames[0]) rows[11][5] = parkNames[0] + '\n1230-2030';
    if (parkNames[1]) rows[12][5] = parkNames[1] + '\n1230-2030';
    if (!parkNames[0] || !parkNames[1]) warnings.push('泊車增派姓名尚未填寫完整（需2位）');
  }

  // ── 增派時數註記 ──
  if (southGate || patrolExtra || parkExtra || stopPatrolExtra) {
    rows[16][4] = '←';
    rows[16][5] = '1600-2000為增派時數';
  }

  // ── 見習：早/晚班共用同一套「找第一個空白列」邏輯（跳過已被泊車/停巡增派佔用的列） ──
  function placeTrainees(trainees, labelCol, nameCol, shiftLabel, timeStr) {
    let r = 11;
    trainees.forEach(p => {
      while (r <= 16 && rows[r][labelCol] !== '') r++;
      if (r > 16) { warnings.push(shiftLabel + '見習「' + p.name + '」超出可用欄位（11~16列已滿），需手動處理'); return; }
      rows[r][labelCol] = '見習';
      rows[r][nameCol] = p.name + '\n' + timeStr;
      r++;
    });
  }
  placeTrainees(earlyTrainees, 4, 5, '早班', DEFAULT_TIME.early);
  placeTrainees(lateTrainees, 11, 12, '晚班', DEFAULT_TIME.late);

  return { rows, warnings, forcedWarnings };
}

/* ══════════════════════ xlsx 匯出：合併儲存格範圍（固定版型，每天都一樣） ══════════════════════ */
const MERGE_RANGES = [
  'A1:C1','I1:N1','A2:B3','C2:G2','I2:N2','C3:D3','E3:G3','I3:K3','L3:M3',
  'A4:A9','C4:D4','F4:G4','J4:K4','M4:N4','C5:D5','F5:G5','J5:K5','M5:N5',
  'H2:H9','C6:D6','F6:G6','J6:K6','M6:N6','C7:D7','F7:G7','J7:K7','M7:N7',
  'C8:D8','F8:G8','J8:K8','M8:N8','C9:D9','F9:G9','J9:K9','M9:N9',
  'A10:N10',
  'A11:A18','H11:H18','C11:D11','F11:G11','J11:K11','M11:N11',
  'C12:D12','F12:G12','J12:K12','M12:N12','C13:D13','F13:G13','J13:K13','M13:N13',
  'C14:D14','F14:G14','J14:K14','M14:N14','C15:D15','J15:K15','M15:N15',
  'C16:D16','J16:K16','M16:N16','C17:D17','J17:K17','M17:N17',
  'B18:G18','I18:N18'
];
function decodeCell(addr) {
  const m = addr.match(/^([A-Z]+)(\d+)$/);
  const colStr = m[1], rowNum = parseInt(m[2], 10) - 1;
  let c = 0;
  for (let i = 0; i < colStr.length; i++) c = c * 26 + (colStr.charCodeAt(i) - 64);
  return { r: rowNum, c: c - 1 };
}
function buildXlsxMerges() {
  return MERGE_RANGES.map(rangeStr => {
    const [a, b] = rangeStr.split(':');
    return { s: decodeCell(a), e: decodeCell(b) };
  });
}
function downloadXlsx(rows, dateStr) {
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!merges'] = buildXlsxMerges();
  ws['!cols'] = new Array(14).fill({ wch: 12 });
  ws['!rows'] = new Array(18).fill({ hpt: 32 });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '哨表');
  XLSX.writeFile(wb, '哨表_' + dateStr.replace(/\//g, '') + '.xlsx');
}

// 18×14 原始表格在手機上要橫滑900px寬才看得完，字又小，改提供逐格清單檢視

  POST_DEFS.forEach(def => { items.push({ label: def.key, value: rows[def.row][def.col] }); });
  items.push({ label: '巡檢增派', value: rows[10][5] });
  items.push({ label: '泊車增派①', value: rows[11][5] });
  items.push({ label: '泊車增派②', value: rows[12][5] });
  items.push({ label: '停巡增派', value: rows[13][5] });
  for (let r = 11; r <= 16; r++) {

    if (rows[r][11] === '見習') items.push({ label: '晚班見習', value: rows[r][12] });
  }
  return items;
}

function PostConfigTab({ postConfig, setPostConfig, employees, loading, onSave, saving, loadError }) {
  const [search, setSearch] = useState('');
  if (loading) return h('div', { className: 'empty-note' }, '讀取員工名單中…');
  if (!employees.length) return h('div', { className: 'empty-note' }, '尚未讀到員工名單（來自早/晚班月班表）');
  function toggle(name, key) {
    setPostConfig(prev => {
      const list = prev[name] || [];
      const exists = hasQual(list, key);
      const next = exists ? list.filter(s => parsePostEntry(s).key !== key) : list.concat([key]);
      return Object.assign({}, prev, { [name]: next });
    });
  }
  function setPriority(name, key, val) {
    setPostConfig(prev => {
      const list = prev[name] || [];
      const next = list.map(s => parsePostEntry(s).key === key ? (val ? key + '|' + val : key) : s);
      return Object.assign({}, prev, { [name]: next });
    });
  }
  const filteredEmployees = search.trim() ? employees.filter(n => n.includes(search.trim())) : employees;
  return h('div', null,
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, h('i', { className: 'ti ti-map-pin' }), '哨點設定（每位員工可勝任哪些哨位）'),

      h('div', { className: 'field', style: { marginBottom: '14px' } },
        h('label', null, '搜尋姓名'),
        h('input', {
          type: 'text', value: search, placeholder: '輸入姓名快速找到那個人',
          onChange: e => setSearch(e.target.value)
        })),
      !filteredEmployees.length && h('div', { className: 'empty-note' }, '找不到符合「' + search + '」的員工'),
      h('div', { className: 'emp-list' },
        filteredEmployees.map(name => h('div', { className: 'emp-card', key: name },
          h('div', { className: 'emp-name' }, name),

            return h('div', { key: g.label },
              h('div', { className: 'post-group' }, g.label),

                g.keys.map(k => h('div', {

                  className: 'post-chip' + (checkedKeys.includes(k) ? ' on' : ''),
                  onClick: () => toggle(name, k)
                }, k))
              ),
              checkedKeys.length > 0 && h('div', { className: 'priority-editor' },
                checkedKeys.map(k => h('div', { className: 'priority-row', key: k },
                  h('span', null, k + ' 優先序'),
                  h('input', {
                    type: 'number', min: 1, className: 'priority-input', placeholder: '不限',
                    value: priorityFor(postConfig[name], k) || '',
                    onChange: e => setPriority(name, k, e.target.value)
                  })
                ))
              )
            );
          })
        ))
      )
    ),
    h('button', { className: 'btn btn-primary', onClick: onSave, disabled: saving || loadError },

  );
}

function localDateStr(d) {
  // 用本地時間組字串，避免 toISOString()（UTC）在台灣凌晨 0:00~7:59 抓成前一天
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

      showToast('預覽已產生', 'ok');
    } catch (e) {
      showToast('產生失敗：' + e.message, 'err');
    }
    setBusy(false);
  }

  function handleExportXlsx() {
    if (!result) return;
    downloadXlsx(result.rows, result.dateLabel.split(' ')[0]);
    showToast('xlsx 已下載', 'ok');
  }

  async function handleUpload() {
    if (!result) return;
    setUploading(true);
    const r = await fetch(GD_UPLOAD_GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'guardUpload', empId: EMP_ID,
        targetSheet, year: result.year, month: result.month, day: result.day, weekday: result.weekday,
        rows: result.rows
      })
    }).then(x => x.json()).catch(e => ({ success: false, error: e.message }));
    setUploading(false);
    if (r.success) showToast('已上傳至「' + targetSheet + '」', 'ok');
    else showToast(r.error || '上傳失敗', 'err');
  }

  return h('div', null,
    toast && h(Toast, toast),
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, h('i', { className: 'ti ti-calendar' }), '日期與增派設定'),
      h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '哨表日期'),
          h('input', { type: 'date', value: dateStr, onChange: e => setDateStr(e.target.value) })),
        h('div', { className: 'field' }, h('label', null, '早班帶隊幹部'),
          h('select', { value: leaderEarly, onChange: e => setLeaderEarly(e.target.value) },
            h('option', { value: '' }, earlyLeaderOptions.length ? '請選擇' : '（哨點設定尚未標記任何人）'),
            earlyLeaderOptions.map(n => h('option', { key: n, value: n }, n)))),
        h('div', { className: 'field' }, h('label', null, '晚班帶隊幹部'),
          h('select', { value: leaderLate, onChange: e => setLeaderLate(e.target.value) },
            h('option', { value: '' }, lateLeaderOptions.length ? '請選擇' : '（哨點設定尚未標記任何人）'),
            lateLeaderOptions.map(n => h('option', { key: n, value: n }, n))))
      ),
      h('div', { className: 'row' },
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: southGate, onChange: e => setSouthGate(e.target.checked) }), h('span', null, '南側門')),
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: patrolExtra, onChange: e => setPatrolExtra(e.target.checked) }), h('span', null, '巡檢增派')),
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: parkExtra, onChange: e => setParkExtra(e.target.checked) }), h('span', null, '泊車增派')),
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: stopPatrolExtra, onChange: e => setStopPatrolExtra(e.target.checked) }), h('span', null, '停巡增派'))
      ),
      parkExtra && h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '泊車增派人員1'),
          h('input', { type: 'text', value: parkNames[0], placeholder: '姓名', onChange: e => setParkNames([e.target.value, parkNames[1]]) })),
        h('div', { className: 'field' }, h('label', null, '泊車增派人員2'),
          h('input', { type: 'text', value: parkNames[1], placeholder: '姓名', onChange: e => setParkNames([parkNames[0], e.target.value]) }))
      ),
      h('button', { className: 'btn btn-primary', onClick: handleGenerate, disabled: busy },
        h('i', { className: 'ti ti-wand' }), busy ? '產生中…' : '產生預覽')
    ),
    result && h('div', { className: 'card' },
      h('div', { className: 'card-title' }, h('i', { className: 'ti ti-table' }), '預覽：' + result.dateLabel),
      result.forcedWarnings.length > 0 && h('div', { className: 'warn-box forced' },
        h('div', { className: 'wtitle' }, h('i', { className: 'ti ti-alert-octagon' }), '一定要看：漏勾增派（' + result.forcedWarnings.length + '）'),
        h('ul', { style: { margin: 0, paddingLeft: '18px' } }, result.forcedWarnings.map((w, i) => h('li', { key: i }, w)))
      ),
      result.warnings.length > 0 && h('div', { className: 'warn-box' },
        h('div', { className: 'wtitle' }, h('i', { className: 'ti ti-alert-triangle' }), '需要注意（' + result.warnings.length + '）'),
        h('ul', { style: { margin: 0, paddingLeft: '18px' } }, result.warnings.map((w, i) => h('li', { key: i }, w)))
      ),
      h('div', { className: 'row', style: { justifyContent: 'flex-end' } },
        h('button', {
          className: 'btn btn-ghost',
          onClick: () => setPreviewMode(previewMode === 'table' ? 'list' : 'table')
        }, h('i', { className: 'ti ti-switch-horizontal' }), previewMode === 'table' ? '切換逐格檢視' : '切換完整表格')
      ),
      previewMode === 'table'
        ? h('table', { className: 'prev-table' },
            h('tbody', null, result.rows.map((row, ri) => h('tr', { key: ri },
              row.map((cell, ci) => h('td', { key: ci, className: cell ? 'has-val' : '' }, cell))
            )))
          )
        : h('div', { className: 'prev-list' },
            flattenPreview(result.rows).map((it, i) => h('div', { className: 'prev-item', key: i },
              h('span', { className: 'prev-item-label' }, it.label),
              h('span', { className: 'prev-item-val' + (it.value ? ' has-val' : '') }, it.value || '未排')
            ))
          ),
      h('div', { className: 'row', style: { marginTop: '14px' } },
        h('button', { className: 'btn btn-ghost', onClick: handleExportXlsx }, h('i', { className: 'ti ti-file-spreadsheet' }), '產生 xlsx 下載'),
        h('div', { className: 'field' }, h('label', null, '上傳目標分頁'),
          h('select', { value: targetSheet, onChange: e => setTargetSheet(e.target.value) },
            h('option', { value: '明日哨表' }, '明日哨表'),
            h('option', { value: '今日哨表' }, '今日哨表'))),
        h('button', { className: 'btn btn-indigo', onClick: handleUpload, disabled: uploading },
          h('i', { className: 'ti ti-cloud-upload' }), uploading ? '上傳中…' : '上傳至試算表')
      )
    )
  );
}

function App() {
  const [tab, setTab] = useState('gen');
  const [employees, setEmployees] = useState([]);
  const [postConfig, setPostConfig] = useState({});
  const [loadingCfg, setLoadingCfg] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  function showToast(msg, type) { setToast({ msg, type }); setTimeout(() => setToast(null), 2600); }

  useEffect(() => {
    (async () => {
      setLoadingCfg(true);
      const [namesRes, cfgRes] = await Promise.all([
        callGuardGas('getEmployeeNames', {}),
        callGuardGas('getGuardPostConfig', {})
      ]);
      let ok = true;
      if (namesRes.status === 'ok') setEmployees(namesRes.data || []); else ok = false;
      if (cfgRes.status === 'ok') setPostConfig(cfgRes.data || {}); else ok = false;
      if (!ok) {
        setLoadError(true);
        showToast('讀取員工名單或哨點設定失敗，請重新整理再試（暫時無法儲存，避免把既有設定覆蓋成空的）', 'err');
      }
      setLoadingCfg(false);
    })();
  }, []);

  async function handleSaveConfig() {
    if (loadError) { showToast('資料載入失敗，無法儲存', 'err'); return; }
    setSaving(true);
    const configs = Object.keys(postConfig).map(name => ({ name, posts: postConfig[name] }));
    const r = await callGuardGas('saveGuardPostConfig', { configs });
    setSaving(false);
    showToast(r.status === 'ok' ? '哨點設定已儲存' : (r.msg || '儲存失敗'), r.status === 'ok' ? 'ok' : 'err');
  }

  return h('div', { className: 'container' },
    toast && h(Toast, toast),
    h(ScrollButtons),
    h('div', { className: 'header' },
      h('a', { className: 'back-btn', href: backUrl() }, h('i', { className: 'ti ti-arrow-left' }), '返回主選單'),
      h('div', { className: 'title-wrap' },
        h('div', { className: 'title-main' }, '自動排哨工具'),
        h('div', { className: 'title-sub' }, 'TIANYING SECURITY · GUARD ROSTER')),
      h('div', { style: { width: '90px' } })
    ),
    h('div', { className: 'tabs' },
      h('button', { className: 'tab-btn' + (tab === 'gen' ? ' active' : ''), onClick: () => setTab('gen') }, h('i', { className: 'ti ti-table' }), ' 產生哨表'),
      h('button', { className: 'tab-btn' + (tab === 'cfg' ? ' active' : ''), onClick: () => setTab('cfg') }, h('i', { className: 'ti ti-map-pin' }), ' 哨點設定')
    ),
    tab === 'gen' ? h(GenerateTab, { postConfig }) : h(PostConfigTab, {
      postConfig, setPostConfig, employees, loading: loadingCfg, onSave: handleSaveConfig, saving, loadError
    })
  );
}

ReactDOM.render(h(App), document.getElementById('root'));
</script>
</body>
</html>
