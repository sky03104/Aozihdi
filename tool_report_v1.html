<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天鷹保全 · 事故報告填寫</title>
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- React 18 & ReactDOM 18 (更穩定的 UMD 版本) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <style>
        :root {
            --bg: #0A0C10;
            --surface: #111827;
            --primary: #D4A800;
            --primary-glow: rgba(212, 168, 0, 0.3);
            --text: #F5F5F5;
            --text-muted: #8A95A8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #4ADE80;
            --error: #F87171;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-heavy: rgba(255, 255, 255, 0.06);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #splash.hide { opacity: 0; visibility: hidden; }
        .splash-ring {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 60px;
        }

        /* Header Area */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .back-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .back-btn:active { transform: scale(0.95); background: var(--glass-heavy); }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-img {
            max-width: 100px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(212,168,0,.7));
        }
        .title-main {
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
            margin-top: 12px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212,168,0,0.3);
        }

        /* Card Style */
        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 20px; }
        .label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
        }
        .label i { color: var(--primary); font-size: 18px; }

        .input, .select, .textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .input:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .textarea { min-height: 120px; resize: none; line-height: 1.5; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #D4A800, #F0C040);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(212,168,0,0.4);
            transition: all 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes toastIn { from { transform: translate(-50%, -100px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

        /* Photo Upload UI */
        .photo-grid { display: flex; gap: 12px; margin-top: 4px; }
        .photo-box {
            flex: 1;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.04);
            border: 2px dashed var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .photo-box:active { background: rgba(255,255,255,0.08); border-color: var(--primary); }
        .photo-box i { font-size: 24px; color: var(--text-muted); }
        .photo-box span { font-size: 11px; color: var(--text-muted); }

        /* Footer Copyright */
        .footer-info {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 30px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="splash"><div class="splash-ring"></div></div>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;

        // 解析 URL 參數
        const params = new URLSearchParams(window.location.search);
        const empId = params.get('empId') || '未登入';

        function App() {
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                time: new Date().toTimeString().slice(0,5),
                location: '',
                category: '一般事故',
                description: '',
                action: '',
                personnel: ''
            });

            const [loading, setLoading] = useState(false);

            useEffect(() => {
                // 強制關閉 Splash
                setTimeout(() => {
                    const splash = document.getElementById('splash');
                    if (splash) {
                        splash.classList.add('hide');
                        setTimeout(() => splash.remove(), 500);
                    }
                }, 600);
            }, []);

            const handleSubmit = async () => {
                if (!formData.location || !formData.description) {
                    showToast("⚠️ 請填寫地點與事故描述", "err");
                    return;
                }
                setLoading(true);
                
                try {
                    // 這裡填入您部署 GAS 後產生的 Web App URL
                    const GAS_URL = "https://script.google.com/macros/s/AKfycbwHXlwTMmJyA79Cuzdh2IPRnBLUWm2YPEqXn5XJj4GVEUlCnNIv8hgRTJ7Xr198hZxG/exec"; 
                    
                    const body = new FormData();
                    body.append('data', JSON.stringify({
                        ...formData,
                        empId: empId
                    }));

                    const res = await fetch(GAS_URL, {
                        method: 'POST',
                        body: body
                    });
                    const result = await res.json();

                    if (result.status === 'ok') {
                        showToast("✅ 事故報告已成功存入雲端！", "success");
                        // 提交成功後 2 秒返回主選單
                        setTimeout(() => {
                            window.location.href = `../index.html?empId=${empId}`;
                        }, 2000);
                    } else {
                        showToast("❌ 提交失敗：" + result.msg, "err");
                    }
                } catch (error) {
                    showToast("❌ 網路連線錯誤，請稍後再試", "err");
                    console.error(error);
                } finally {
                    setLoading(false);
                }
            };

            return React.createElement("div", { className: "container" },
                // Header
                React.createElement("div", { className: "header" },
                    React.createElement("a", { href: `../index.html?empId=${empId}`, className: "back-btn" },
                        React.createElement("i", { className: "ti ti-chevron-left" }), "返回主選單"
                    ),
                    React.createElement("div", { style: { fontSize: '12px', color: 'var(--text-muted)' } }, 
                        React.createElement("span", { style: { color: 'var(--primary)' } }, "回報人員："), empId
                    )
                ),

                // Logo Area
                React.createElement("div", { className: "logo-area" },
                    // 這裡使用文字模擬 LOGO 效果，正式環境可換回 Base64 或 圖片路徑
                    React.createElement("div", { style: { fontSize: '40px' } }, "🦅"),
                    React.createElement("div", { className: "title-main" }, "事故報告填寫系統")
                ),

                // Form Card
                React.createElement("div", { className: "card" },
                    // 時間日期
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-calendar-event" }), "事故日期與時間"),
                        React.createElement("div", { style: { display: 'flex', gap: '10px' } },
                            React.createElement("input", { type: "date", className: "input", value: formData.date, onChange: e => setFormData({...formData, date: e.target.value}) }),
                            React.createElement("input", { type: "time", className: "input", value: formData.time, onChange: e => setFormData({...formData, time: e.target.value}) })
                        )
                    ),
                    
                    // 地點
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-map-pin" }), "事故地點"),
                        React.createElement("input", { className: "input", placeholder: "例如：A棟大廳、停車場B2", value: formData.location, onChange: e => setFormData({...formData, location: e.target.value}) })
                    ),

                    // 類別
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-category" }), "事故類別"),
                        React.createElement("select", { className: "input", value: formData.category, onChange: e => setFormData({...formData, category: e.target.value}) },
                            ["一般事故", "竊盜事件", "爭執糾紛", "設備故障", "意外受傷", "火警通報", "其他"].map(c => 
                                React.createElement("option", { key: c, value: c }, c)
                            )
                        )
                    ),

                    // 描述
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-file-description" }), "事故經過描述"),
                        React.createElement("textarea", { className: "textarea", placeholder: "請詳細描述事故發生經過...", value: formData.description, onChange: e => setFormData({...formData, description: e.target.value}) })
                    ),

                    // 處理結果
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-tool" }), "目前處理經過與結果"),
                        React.createElement("textarea", { className: "textarea", placeholder: "請描述目前處理進度與最終結果...", value: formData.action, onChange: e => setFormData({...formData, action: e.target.value}) })
                    ),

                    // 相關人員
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-users" }), "現場相關人員"),
                        React.createElement("input", { className: "input", placeholder: "姓名或工號，多人請用逗號隔開", value: formData.personnel, onChange: e => setFormData({...formData, personnel: e.target.value}) })
                    ),
                    
                    // 照片上傳
                    React.createElement("div", { className: "form-group" },
                        React.createElement("label", { className: "label" }, React.createElement("i", { className: "ti ti-camera" }), "現場照片 (最多3張)"),
                        React.createElement("div", { className: "photo-grid" },
                            [1,2,3].map(i => 
                                React.createElement("div", { key: i, className: "photo-box" },
                                    React.createElement("i", { className: "ti ti-plus" }),
                                    React.createElement("span", null, "點擊上傳")
                                )
                            )
                        )
                    )
                ),

                // Submit Button
                React.createElement("button", { className: "btn-submit", onClick: handleSubmit, disabled: loading },
                    loading ? React.createElement("i", { className: "ti ti-loader-2 spin" }) : React.createElement("i", { className: "ti ti-send" }),
                    loading ? "正在提交..." : "提交事故報告"
                ),

                // Footer
                React.createElement("div", { className: "footer-info" }, "© TIANYING SECURITY · INTERNAL SYSTEM")
            );
        }

        // Toast 實作
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = type === 'success' ? '#22C55E' : '#E53E3E';
            toast.style.color = '#fff';
            toast.innerHTML = `<i class="ti ti-${type === 'success' ? 'check' : 'alert-circle'}"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                toast.style.transition = 'all 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
